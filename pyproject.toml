[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foldsmith"
version = "0.1.0"
description = "Dimension-driven printable paper tray patterns, with no runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sameer Deolalikar"}]
keywords = ["papercraft", "svg", "geometry", "box", "printing"]

[project.scripts]
foldsmith = "foldsmith.cli:main"

[tool.setuptools.packages.find]
include = ["foldsmith*"]
