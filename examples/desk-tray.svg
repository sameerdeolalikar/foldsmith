<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title description" font-family="sans-serif" fill="#172b36"><title id="title">Foldsmith printable tray pattern</title><desc id="description">Open tray: 80 by 60 mm base, 25 mm walls. Solid lines are cuts; dashed lines are folds. Glue the four shaded tabs inside the adjacent side walls.</desc><rect width="100%" height="100%" fill="white" /><text x="10" y="16" font-size="5" font-weight="bold">FOLDSMITH / OPEN TRAY</text><text x="10" y="23" font-size="3.2">Base 80 × 60 mm · wall 25 mm · glue tab 10 mm</text><g id="pattern" transform="translate(40 92.5)"><text x="65" y="56" font-size="2.6" text-anchor="middle" fill="#61747f">BASE</text><text x="65" y="13.5" font-size="2.6" text-anchor="middle" fill="#61747f">BACK</text><text x="65" y="98.5" font-size="2.6" text-anchor="middle" fill="#61747f">FRONT</text><text x="12.5" y="56" font-size="2.6" text-anchor="middle" fill="#61747f">LEFT</text><text x="117.5" y="56" font-size="2.6" text-anchor="middle" fill="#61747f">RIGHT</text><polygon points="25,0 15,4 15,21 25,25" fill="#e3e9ec" /><polygon points="105,0 115,4 115,21 105,25" fill="#e3e9ec" /><polygon points="25,85 15,89 15,106 25,110" fill="#e3e9ec" /><polygon points="105,85 115,89 115,106 105,110" fill="#e3e9ec" /><g id="cut-lines" fill="none" stroke="#172b36" stroke-width="0.25"><line x1="25" y1="0" x2="105" y2="0" /><line x1="25" y1="110" x2="105" y2="110" /><line x1="0" y1="25" x2="25" y2="25" /><line x1="0" y1="85" x2="25" y2="85" /><line x1="0" y1="25" x2="0" y2="85" /><line x1="105" y1="25" x2="130" y2="25" /><line x1="130" y1="25" x2="130" y2="85" /><line x1="105" y1="85" x2="130" y2="85" /><line x1="15" y1="4" x2="25" y2="0" /><line x1="15" y1="4" x2="15" y2="21" /><line x1="15" y1="21" x2="25" y2="25" /><line x1="105" y1="0" x2="115" y2="4" /><line x1="115" y1="4" x2="115" y2="21" /><line x1="105" y1="25" x2="115" y2="21" /><line x1="15" y1="89" x2="25" y2="85" /><line x1="15" y1="89" x2="15" y2="106" /><line x1="15" y1="106" x2="25" y2="110" /><line x1="105" y1="85" x2="115" y2="89" /><line x1="115" y1="89" x2="115" y2="106" /><line x1="105" y1="110" x2="115" y2="106" /></g><g id="fold-lines" fill="none" stroke="#172b36" stroke-width="0.25" stroke-dasharray="2 1.5"><line x1="25" y1="25" x2="105" y2="25" /><line x1="105" y1="25" x2="105" y2="85" /><line x1="25" y1="85" x2="105" y2="85" /><line x1="25" y1="25" x2="25" y2="85" /><line x1="105" y1="0" x2="105" y2="25" /><line x1="25" y1="0" x2="25" y2="25" /><line x1="105" y1="85" x2="105" y2="110" /><line x1="25" y1="85" x2="25" y2="110" /></g></g><text x="10" y="271" font-size="3">Cut solid lines. Score dashed lines. Fold walls up; glue tabs inside sides.</text><text x="10" y="277" font-size="3">Print at 100% / actual size. Disable fit-to-page and browser headers/footers.</text><g id="calibration" stroke="#172b36" stroke-width="0.3"><line x1="10" y1="283.0" x2="60" y2="283.0" /><line x1="10" y1="281.0" x2="10" y2="285.0" /><line x1="60" y1="281.0" x2="60" y2="285.0" /></g><text x="64" y="284" font-size="3">50 mm — measure before cutting</text></svg>
