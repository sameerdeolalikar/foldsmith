<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title description" font-family="sans-serif" fill="#172b36"><title id="title">Foldsmith printable tray pattern</title><desc id="description">Open tray: 180 by 50 mm base, 20 mm walls. Solid lines are cuts; dashed lines are folds. Glue the four shaded tabs inside the adjacent side walls.</desc><rect width="100%" height="100%" fill="white" /><text x="10" y="16" font-size="5" font-weight="bold">FOLDSMITH / OPEN TRAY</text><text x="10" y="23" font-size="3.2">Base 180 × 50 mm · wall 20 mm · glue tab 10 mm</text><g id="pattern" transform="translate(38.5 59)"><text x="110" y="46" font-size="2.6" text-anchor="middle" fill="#61747f">BASE</text><text x="110" y="11" font-size="2.6" text-anchor="middle" fill="#61747f">BACK</text><text x="110" y="81" font-size="2.6" text-anchor="middle" fill="#61747f">FRONT</text><polygon points="20,0 10,4 10,16 20,20" fill="#e3e9ec" /><polygon points="200,0 210,4 210,16 200,20" fill="#e3e9ec" /><polygon points="20,70 10,74 10,86 20,90" fill="#e3e9ec" /><polygon points="200,70 210,74 210,86 200,90" fill="#e3e9ec" /><g id="cut-lines" fill="none" stroke="#172b36" stroke-width="0.25"><line x1="20" y1="0" x2="200" y2="0" /><line x1="20" y1="90" x2="200" y2="90" /><line x1="0" y1="20" x2="20" y2="20" /><line x1="0" y1="70" x2="20" y2="70" /><line x1="0" y1="20" x2="0" y2="70" /><line x1="200" y1="20" x2="220" y2="20" /><line x1="220" y1="20" x2="220" y2="70" /><line x1="200" y1="70" x2="220" y2="70" /><line x1="10" y1="4" x2="20" y2="0" /><line x1="10" y1="4" x2="10" y2="16" /><line x1="10" y1="16" x2="20" y2="20" /><line x1="200" y1="0" x2="210" y2="4" /><line x1="210" y1="4" x2="210" y2="16" /><line x1="200" y1="20" x2="210" y2="16" /><line x1="10" y1="74" x2="20" y2="70" /><line x1="10" y1="74" x2="10" y2="86" /><line x1="10" y1="86" x2="20" y2="90" /><line x1="200" y1="70" x2="210" y2="74" /><line x1="210" y1="74" x2="210" y2="86" /><line x1="200" y1="90" x2="210" y2="86" /></g><g id="fold-lines" fill="none" stroke="#172b36" stroke-width="0.25" stroke-dasharray="2 1.5"><line x1="20" y1="20" x2="200" y2="20" /><line x1="200" y1="20" x2="200" y2="70" /><line x1="20" y1="70" x2="200" y2="70" /><line x1="20" y1="20" x2="20" y2="70" /><line x1="200" y1="0" x2="200" y2="20" /><line x1="20" y1="0" x2="20" y2="20" /><line x1="200" y1="70" x2="200" y2="90" /><line x1="20" y1="70" x2="20" y2="90" /></g></g><text x="10" y="184" font-size="3">Cut solid lines. Score dashed lines. Fold walls up; glue tabs inside sides.</text><text x="10" y="190" font-size="3">Print at 100% / actual size. Disable fit-to-page and browser headers/footers.</text><g id="calibration" stroke="#172b36" stroke-width="0.3"><line x1="10" y1="196.0" x2="60" y2="196.0" /><line x1="10" y1="194.0" x2="10" y2="198.0" /><line x1="60" y1="194.0" x2="60" y2="198.0" /></g><text x="64" y="197" font-size="3">50 mm — measure before cutting</text></svg>
